gure></div><h2 id="ruins-double-path">坍拱双径</h2><div class="grid"><figure><a href="ruins-double-path-oblique.png"><img loading="lazy" src="ruins-double-path-oblique.png" alt="坍拱双径斜俯视"></a><figcaption>斜俯视</figcaption></figure><figure><a href="ruins-double-path-top.png"><img loading="lazy" src="ruins-double-path-top.png" alt="坍拱双径俯视"></a><figcaption>俯视</figcaption></figure><figure><a href="ruins-double-path-side.png"><img loading="lazy" src="ruins-double-path-side.png" alt="坍拱双径低侧视"></a><figcaption>低侧视</figcaption></figure><figure><a href="ruins-double-path-play.png"><img loading="lazy" src="ruins-double-path-play.png" alt="坍拱双径玩家相机"></a><figcaption>玩家相机</figcaption></figure></div><h2 id="detail">细节与移动端</h2><div class="grid"><figure><a href="ground-detail.png"><img src="ground-detail.png"></a><figcaption>墙体灰浆接缝与墙根碎石</figcaption></figure><figure><a href="mobile-gameplay.png"><img src="mobile-gameplay.png"></a><figcaption>触屏控件、实际玩家相机与战斗房</figcaption></figure></div><h2>光照与固定火源</h2><div class="grid"><figure><a href="lighting-torch.png"><img src="lighting-torch.png" alt="墙挂火把"></a><figcaption>墙挂火把与暖色补光</figcaption></figure><figure><a href="lighting-camp.png"><img src="lighting-camp.png" alt="角落篝火"></a><figcaption>篝火、柔和阴影与石材高光</figcaption></figure></div><h2>可复用模型库</h2><a href="blender-module-library.png"><img loading="lazy" src="blender-module-library.png"></a><p>模型几何和材质共享，通过程序按网格实例化；材质源图与 Blender 文件均保留。</p></main></html>
