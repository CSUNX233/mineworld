<!doctype html><meta charset="utf-8"><title>Sunlit Quest · P0 素材选型</title><style>body{margin:30px;background:#142b40;color:#f6e8ca;font:16px system-ui}h1{color:#ebbf63}section{margin:32px 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}img{width:100%;display:block;image-rendering:pixelated}figure{margin:0;background:#0d1c2a;padding:12px;border:1px solid #77684d}figcaption{padding:8px}p{line-height:1.7;color:#d0c6b4}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style><h1>Sunlit Quest · P0 美术 A/B 选型</h1><p>每个素材均有两种版本，可按单项混选。当前为选型图集，部分背景需在选定后清理；尚未替换游戏素材。</p><section><h2>状态图标</h2><p>从左到右：燃烧、冰冻、减速、中毒；感电、护盾、增伤、生命恢复。</p><div class="pair"><figure><figcaption>A · 简洁</figcaption><img src="status-a.png" alt="状态图标 A"></figure><figure><figcaption>B · 装饰增强</figcaption><img src="status-b.png" alt="状态图标 B"></figure></div></section><section><h2>战斗特效</h2><p>从左到右：刀光、命中闪光、火星、冰晶；闪电、烟雾、冲击环、暗影命中。</p><div class="pair"><figure><figcaption>A · 简洁</figcaption><img src="effects-a.png" alt="战斗特效 A"></figure><figure><figcaption>B · 装饰增强</figcaption><img src="effects-b.png" alt="战斗特效 B"></figure></div></section><section><h2>危险预警与瞄准</h2><p>从左到右：圆形范围、扇形范围、直线攻击；落点、瞄准、精英标记。</p><div class="pair"><figure><figcaption>A · 简洁</figcaption><img src="telegraphs-a.png" alt="危险预警与瞄准 A"></figure><figure><figcaption>B · 装饰增强</figcaption><img src="telegraphs-b.png" alt="危险预警与瞄准 B"></figure></div></section>
